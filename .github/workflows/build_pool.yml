name: Soru havuzunu hazırla

on:
  schedule:
    - cron: "0 1 * * *"   # günde bir kez: 04:00 (TR); toplam ~20 dk
  workflow_dispatch:
    inputs:
      grades:
        description: "Sınıflar (virgülle)"
        default: "5"
      subjects:
        description: "Dersler (virgülle)"
        default: "Matematik,Fen Bilimleri,Türkçe,Sosyal Bilgiler,Din Kültürü ve Ahlak Bilgisi,İngilizce"
      per_unit:
        description: "Matematik/Fen dışı derslerde ünite başına istenen soru"
        default: "1"
      per_unit_core:
        description: "Matematik ve Fen'de ünite başına istenen soru"
        default: "2"
      minutes:
        description: "Havuz üretimi en çok çalışma süresi (dk)"
        default: "16"

permissions:
  contents: write

concurrency:
  group: build-pool
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install groq google-genai matplotlib numpy pandas altair reportlab requests pypdf
      - name: Hatalı bildirimleri al (userdata dalı, varsa)
        run: |
          mkdir -p _ud
          git fetch origin userdata:refs/remotes/origin/userdata || true
          git archive origin/userdata data 2>/dev/null | tar -x -C _ud || true
      - name: Havuzu üret
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
          SAMBANOVA_API_KEYS: ${{ secrets.SAMBANOVA_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
        run: python tools/build_pool.py --grades "${{ github.event.inputs.grades || '5' }}" --subjects "${{ github.event.inputs.subjects || 'Matematik,Fen Bilimleri,Türkçe,Sosyal Bilgiler,Din Kültürü ve Ahlak Bilgisi,İngilizce' }}" --per-unit "${{ github.event.inputs.per_unit || '1' }}" --per-unit-core "${{ github.event.inputs.per_unit_core || '2' }}" --minutes "${{ github.event.inputs.minutes || '16' }}" --bad-dir _ud/data
      - name: Matematik şablonlarını üret
        continue-on-error: true
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
          SAMBANOVA_API_KEYS: ${{ secrets.SAMBANOVA_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
        run: python tools/build_templates.py --grades "${{ github.event.inputs.grades || '5' }}" --per-unit 1 --minutes 4
      - name: Bilgi bankasını doğrula (bağımsız model)
        continue-on-error: true
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
          SAMBANOVA_API_KEYS: ${{ secrets.SAMBANOVA_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
        run: python tools/verify_bank.py --max-q 240
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "denemematik-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pool templates
          git diff --cached --quiet || (git commit -m "Soru havuzu güncellendi" && git pull --rebase && git push)
